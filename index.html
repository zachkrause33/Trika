<style>
  :root{
    --bg:#fef9f0;--bg-card:#ffffff;--line:#e8dcc1;--line-soft:#f0e8d4;
    --ink:#1a1a1a;--ink-soft:#6b6558;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--ink);font-family:'Fraunces',Georgia,serif;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;}
  .app{max-width:440px;margin:0 auto;height:100svh;display:flex;flex-direction:column;padding:20px 16px 24px;}

  .hub-header{text-align:center;margin-bottom:12px;flex-shrink:0;}
  .hub-dots{display:flex;gap:8px;justify-content:center;margin-bottom:8px;}
  .hub-dot{width:10px;height:10px;border-radius:50%;}
  .hub-dot.orange{background:#ea580c;}
  .hub-dot.red{background:#dc2626;}
  .hub-dot.teal{background:#0f766e;}
  .hub-dot.dark{background:#7c3aed;}
  .hub-title{font-family:'Fraunces',serif;font-weight:700;font-size:54px;line-height:1;background:linear-gradient(135deg,#ea580c,#d946ef);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}

  /* Social bar */
  .discord-bar{flex-shrink:0;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;}
  .discord-link{display:flex;align-items:center;gap:7px;padding:10px 22px;border-radius:20px;background:#5865f2;color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;text-decoration:none;letter-spacing:0.03em;transition:all 0.15s;}
  .discord-link:active{transform:scale(0.96);}
  .discord-icon{width:16px;height:16px;flex-shrink:0;}
  .reddit-link{display:flex;align-items:center;gap:7px;padding:10px 22px;border-radius:20px;background:#FF4500;color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:13px;text-decoration:none;letter-spacing:0.03em;transition:all 0.15s;}
  .reddit-link:active{transform:scale(0.96);}
  .reddit-icon{width:16px;height:16px;flex-shrink:0;}

  /* Game cards */
  .games-list{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;}
  .game-card{background:var(--bg-card);border:1.5px solid var(--line-soft);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.15s;text-decoration:none;flex:1;min-height:0;}
  .game-card:active{transform:scale(0.98);}
  .game-accent{width:5px;border-radius:3px;flex-shrink:0;align-self:stretch;}
  .game-info{flex:1;min-width:0;}
  .game-name{font-family:'Fraunces',serif;font-weight:700;font-size:20px;line-height:1;margin-bottom:4px;}
  .game-desc{font-family:'Inter',sans-serif;font-size:13px;color:var(--ink-soft);line-height:1.35;}
  .game-play-btn{flex-shrink:0;padding:10px 18px;border-radius:10px;border:none;font-family:'Inter',sans-serif;font-weight:800;font-size:14px;color:#fff;cursor:pointer;transition:all 0.15s;letter-spacing:0.05em;}
  .game-play-btn:active{transform:scale(0.95);}

  /* Color themes */
  .card-trika{flex:1.6;position:relative;padding:24px 16px;border-width:2px;border-color:#f4c09a;background:#ffffff;}
  .card-trika .game-name{color:#c2410c;font-size:32px;margin-bottom:6px;}
  .card-trika .game-desc{font-size:15px;}
  .card-trika .game-play-btn{background:#ea580c;box-shadow:0 4px 14px rgba(234,88,12,0.35);padding:15px 24px;border-radius:12px;font-size:17px;}
  .game-badge{position:absolute;top:-13px;right:14px;background:#ea580c;color:#fff;font-family:'Inter',sans-serif;font-weight:800;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;border-radius:20px;}

  .card-blitz{border-color:#f0e0e0;}
  .card-blitz .game-accent{background:#dc2626;}
  .card-blitz .game-name{color:#b91c1c;margin-bottom:8px;}
  .card-blitz .game-play-btn{background:#dc2626;box-shadow:0 4px 12px rgba(220,38,38,0.3);}
  .blitz-mode-toggle{display:flex;gap:8px;justify-content:center;}
  .blitz-mode-btn{padding:6px 20px;border-radius:20px;border:2px solid #dc2626;background:transparent;color:#dc2626;font-family:'Inter',sans-serif;font-weight:800;font-size:12px;letter-spacing:0.04em;cursor:pointer;transition:all 0.15s;}
  .blitz-mode-btn.active{background:#dc2626;color:#fff;}
  .blitz-mode-btn:active{transform:scale(0.94);}

  .card-precision{border-color:#c6e9e6;}
  .card-precision .game-accent{background:#0f766e;}
  .card-precision .game-name{color:#0f766e;}
  .card-precision .game-play-btn{background:#0f766e;box-shadow:0 4px 12px rgba(15,118,110,0.3);}

  .card-survival{border-color:#ddd0f8;}
  .card-survival .game-accent{background:#7c3aed;}
  .card-survival .game-name{color:#6d28d9;}
  .card-survival .game-desc{color:#6b6558;}
  .card-survival .game-play-btn{background:#7c3aed;box-shadow:0 4px 12px rgba(124,58,237,0.3);}

  /* Rules sheet */
  .rules-overlay{position:fixed;inset:0;background:rgba(26,26,26,0.6);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  .rules-overlay.hide{display:none!important;}
  .rules-sheet{background:var(--bg);border-radius:24px 24px 0 0;padding:18px 18px 28px;width:100%;max-width:440px;max-height:92svh;overflow-y:auto;animation:sheetUp 0.3s cubic-bezier(.22,1.2,.4,1);}
  @keyframes sheetUp{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
  .rules-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .rules-title{font-family:'Fraunces',serif;font-weight:700;font-size:20px;}
  .rules-close{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg-card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--ink-soft);flex-shrink:0;}
  .rules-close:active{transform:scale(0.92);}
  .rules-visual{background:var(--bg);border-radius:10px;padding:10px 6px;margin-bottom:12px;text-align:center;}
  .rules-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .rules-step{display:flex;gap:10px;align-items:flex-start;}
  .rules-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:800;font-size:10px;color:#fff;flex-shrink:0;margin-top:1px;}
  .rules-text{font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);line-height:1.4;}
  .rules-actions{display:flex;flex-direction:column;gap:6px;}
  .rules-play-btn{width:100%;padding:14px;border-radius:14px;border:none;font-family:'Inter',sans-serif;font-weight:800;font-size:15px;color:#fff;cursor:pointer;transition:all 0.2s;letter-spacing:0.05em;}
  .rules-play-btn:active{transform:scale(0.97);}
  .rules-skip{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px;cursor:pointer;}
  .rules-skip-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);background:var(--bg-card);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rules-skip-check.checked{background:var(--ink);border-color:var(--ink);}
  .rules-skip-check.checked::after{content:'✓';font-size:10px;color:#fff;font-weight:800;}
  .rules-skip-label{font-family:'Inter',sans-serif;font-size:12px;color:var(--ink-soft);}

  /* Demo tiles */
  .rules-demo-grid{display:inline-grid;gap:4px;margin:0 auto;}
  .rules-demo-grid.g3{grid-template-columns:repeat(3,1fr);}
  .demo-tile{width:36px;height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:800;font-size:15px;border:2px solid transparent;}
  .demo-tile.small{width:26px;height:26px;font-size:11px;border-radius:5px;}
  .demo-tile.t1{background:#fffbed;color:#78350f;border-color:#fcd34d;}
  .demo-tile.t2{background:#fef3c7;color:#78350f;border-color:#fcd34d;}
  .demo-tile.t3{background:#fde8b8;color:#78350f;border-color:#f59e0b;}
  .demo-tile.t4{background:#fed7aa;color:#78350f;border-color:#f97316;}
  .demo-tile.t5{background:#fdba74;color:#7c2d12;border-color:#f97316;}
  .demo-tile.t6{background:#fb923c;color:#fff;border-color:#ea580c;}
  .demo-tile.t7{background:#f97316;color:#fff;border-color:#ea580c;}
  .demo-tile.t8{background:#ea580c;color:#fff;border-color:#c2410c;}
  .demo-tile.t9{background:#dc2626;color:#fff;border-color:#991b1b;}
  .demo-tile.empty-cell{background:rgba(124,58,237,0.07);border:1px solid rgba(124,58,237,0.15);}
  @keyframes demoGlow{0%{transform:scale(1)}100%{transform:scale(1.06)}}
  .demo-eq{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#16a34a;margin-top:8px;}
</style>
</head>
<body>
<div class="app">

  <div class="hub-header">
    <div class="hub-dots">
      <div class="hub-dot orange"></div>
      <div class="hub-dot red"></div>
      <div class="hub-dot teal"></div>
      <div class="hub-dot dark"></div>

    <div class="hub-title">Trika</div>
  </div>

  <div class="games-list">

    <div class="game-card card-trika" onclick="showRules('trika')">

        <div class="game-name">Trika</div>
        <div class="game-desc">Find equations hidden in the grid.</div>

        </div>
      </div>
      <button class="game-play-btn" onclick="event.stopPropagation();showRules('blitz')">Play</button>
    </div>

    <div class="game-card card-precision" onclick="showRules('precision')">

      <div class="game-info">
        <div class="game-name">Trika Precision</div>
        <div class="game-desc">A target number. Find the two tiles that reach it.</div>

      <button class="game-play-btn" onclick="event.stopPropagation();showRules('precision')">Play</button>

        <div class="game-desc">Numbers fall. Clear equations before the board fills up.</div>
      </div>
      <button class="game-play-btn" onclick="event.stopPropagation();showRules('survival')">Play</button>
    </div>

  </div>

  <div class="discord-bar">
    <a class="discord-link" href="https://discord.gg/H6awaHFRY" target="_blank" rel="noopener">

    <a class="reddit-link" href="https://www.reddit.com/r/Play_Trika/" target="_blank" rel="noopener">

      Reddit

  </div>

</div>

<!-- Rules overlay -->
<div class="rules-overlay hide" id="rules-overlay" onclick="closeRulesIfOutside(event)">
  <div class="rules-sheet" id="rules-sheet">
    <div class="rules-header">
      <div class="rules-title" id="rules-title">How to play</div>
      <div class="rules-close" onclick="closeRules()">×</div>
    </div>
    <div class="rules-visual" id="rules-visual"></div>
    <div class="rules-steps" id="rules-steps"></div>
    <div class="rules-actions">
      <button class="rules-play-btn" id="rules-play-btn" onclick="goToGame()">Play now</button>

<script>
const GAMES = {
  trika: {
    name: 'Trika',
    color: '#ea580c',
    url: '/numbers',
    steps: [
      'Tap three tiles in a <strong>row or column</strong> that form a valid equation — like 9−6=3 or 4×5=20.',
      'Every correct equation adds time. Operations unlock as you progress: addition first, then subtraction, multiplication, and division.',
      'Build a streak to multiply your score. The board grows from 3×3 to 5×5 as you find more equations.',
      'Game ends when time runs out.'
    ]
  },
  blitz: {
    name: 'Trika Blitz',
    color: '#dc2626',
    url: '/blitz',
    steps: [
      'Same equation mechanic — tap three tiles in a <strong>row or column</strong> that form a valid equation.',
      'Pick your clock on the start screen: <strong>1 minute</strong> or <strong>5 minutes</strong>. Wrong guesses cost you 5 seconds. No time is added for correct answers.',
      'Harder operations score more: + 100pts · − 200pts · × 500pts · ÷ 1,000pts.',
      'How many equations can you find before time runs out?'
    ]
  },
  precision: {
    name: 'Trika Precision',
    color: '#0f766e',
    url: '/precision',
    steps: [
      'A <strong>target number</strong> is shown at the top. Find two <strong>adjacent</strong> tiles — same row or column, next to each other — that combine to reach it, then tap them in order.',
      'Addition and multiplication work in <strong>either order</strong>. For subtraction and division, tap the <strong>larger number first</strong> — larger − smaller, larger ÷ smaller.',
      'Correct pairs clear, a new target appears, and you gain time. Puzzles start with addition and subtraction, but <strong>any operation always counts</strong> — spot a multiplication or division early and it\'s still a win.',
      'Wrong pairs cost 5 seconds. Your first tap is always safe — it\'s just picking your starting number.'
    ]
  },
  survival: {
    name: 'Trika Survival',
    color: '#7c3aed',
    url: '/survival',
    steps: [
      'Numbers fall and stack at the bottom. Speed increases over time.',
      'Tap <strong>any three tiles anywhere</strong> in equation order — they don\'t need to be adjacent.',
      'Cleared tiles disappear and tiles above fall down.',
      'Game over when the board fills up.'
    ]
  }
};

let currentGame = null;
let skipChecked = false;
let blitzMode = '1';

function getSkipKey(game){ return `trika-skip-rules-${game}`; }

function setBlitzMode(m){
  blitzMode = m;
  document.querySelectorAll('.blitz-mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===m));
}

function gameUrlSuffix(game){
  return game === 'blitz' ? `mode=${blitzMode}&play=1` : 'play=1';
}

function renderVisual(game){
  const el = document.getElementById('rules-visual');
  if(game === 'trika'){
    el.innerHTML = `
      <div style="display:flex;gap:14px;align-items:flex-start;justify-content:center;">
        <div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--ink-soft);letter-spacing:0.1em;text-transform:uppercase;text-align:center;margin-bottom:5px;">row</div>
          <div class="rules-demo-grid g3">
            <div class="demo-tile t2" style="outline:3px solid #ea580c;outline-offset:2px;">2</div>
            <div class="demo-tile t6" style="outline:3px solid #ea580c;outline-offset:2px;">6</div>
            <div class="demo-tile t8" style="outline:3px solid #ea580c;outline-offset:2px;">8</div>
            <div class="demo-tile t4">4</div><div class="demo-tile t1">1</div><div class="demo-tile t9">9</div>
            <div class="demo-tile t7">7</div><div class="demo-tile t3">3</div><div class="demo-tile t5">5</div>
          </div>
          <div class="demo-eq" style="color:#ea580c;">2 + 6 = 8 ✓</div>
        </div>
        <div style="font-family:'Fraunces',serif;font-size:18px;color:var(--ink-soft);padding-top:20px;">or</div>
        <div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--ink-soft);letter-spacing:0.1em;text-transform:uppercase;text-align:center;margin-bottom:5px;">column</div>
          <div class="rules-demo-grid g3">
            <div class="demo-tile t2">2</div><div class="demo-tile t3" style="outline:3px solid #ea580c;outline-offset:2px;">3</div><div class="demo-tile t7">7</div>
            <div class="demo-tile t1">1</div><div class="demo-tile t6" style="outline:3px solid #ea580c;outline-offset:2px;">6</div><div class="demo-tile t4">4</div>
            <div class="demo-tile t5">5</div><div class="demo-tile t9" style="outline:3px solid #ea580c;outline-offset:2px;">9</div><div class="demo-tile t8">8</div>
          </div>
          <div class="demo-eq" style="color:#ea580c;">3 + 6 = 9 ✓</div>
        </div>
      </div>`;
  } else if(game === 'blitz'){
    el.innerHTML = `
      <div style="display:flex;gap:14px;align-items:flex-start;justify-content:center;">
        <div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--ink-soft);letter-spacing:0.1em;text-transform:uppercase;text-align:center;margin-bottom:5px;">row</div>
          <div class="rules-demo-grid g3">
            <div class="demo-tile t2" style="outline:3px solid #dc2626;outline-offset:2px;">2</div>
            <div class="demo-tile t6" style="outline:3px solid #dc2626;outline-offset:2px;">6</div>
            <div class="demo-tile t8" style="outline:3px solid #dc2626;outline-offset:2px;">8</div>
            <div class="demo-tile t4">4</div><div class="demo-tile t1">1</div><div class="demo-tile t9">9</div>
            <div class="demo-tile t7">7</div><div class="demo-tile t3">3</div><div class="demo-tile t5">5</div>
          </div>
          <div class="demo-eq" style="color:#dc2626;">2 + 6 = 8 ✓</div>
        </div>
        <div style="font-family:'Fraunces',serif;font-size:18px;color:var(--ink-soft);padding-top:20px;">or</div>
        <div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--ink-soft);letter-spacing:0.1em;text-transform:uppercase;text-align:center;margin-bottom:5px;">column</div>
          <div class="rules-demo-grid g3">
            <div class="demo-tile t2">2</div><div class="demo-tile t3" style="outline:3px solid #dc2626;outline-offset:2px;">3</div><div class="demo-tile t7">7</div>
            <div class="demo-tile t1">1</div><div class="demo-tile t6" style="outline:3px solid #dc2626;outline-offset:2px;">6</div><div class="demo-tile t4">4</div>
            <div class="demo-tile t5">5</div><div class="demo-tile t9" style="outline:3px solid #dc2626;outline-offset:2px;">9</div><div class="demo-tile t8">8</div>
          </div>
          <div class="demo-eq" style="color:#dc2626;">3 + 6 = 9 ✓</div>
        </div>
      </div>`;
  } else if(game === 'precision'){
    el.innerHTML = `
      <div style="text-align:center;">
        <div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink-soft);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;">target</div>
        <div style="font-family:'Fraunces',serif;font-weight:700;font-size:30px;color:#0f766e;margin-bottom:12px;">6</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;">
          <div style="text-align:center;">
            <div class="demo-tile t9" style="outline:3px solid #0f766e;outline-offset:2px;">9</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--ink-soft);letter-spacing:0.05em;text-transform:uppercase;margin-top:3px;">tap 1st</div>
          </div>
          <div style="font-family:'Fraunces',serif;color:var(--ink-soft);padding-bottom:16px;">→</div>
          <div style="text-align:center;">
            <div class="demo-tile t3">3</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--ink-soft);letter-spacing:0.05em;text-transform:uppercase;margin-top:3px;">tap 2nd</div>
          </div>
        </div>
        <div class="demo-eq" style="color:#0f766e;">9 − 3 = 6 ✓</div>
        <div style="font-family:'Inter',sans-serif;font-size:10px;color:var(--ink-soft);margin-top:6px;">tapping 3 first instead → wrong order ✗</div>
      </div>`;
  } else if(game === 'survival'){
    el.innerHTML = `
      <div style="display:inline-grid;grid-template-columns:repeat(5,28px);grid-template-rows:repeat(5,28px);gap:3px;margin-bottom:6px;">
        <!-- row 0: empty -->
        <div class="demo-tile empty-cell"></div><div class="demo-tile empty-cell"></div><div class="demo-tile empty-cell"></div><div class="demo-tile empty-cell"></div><div class="demo-tile empty-cell"></div>
        <!-- row 1: one tile -->
        <div class="demo-tile empty-cell"></div><div class="demo-tile empty-cell"></div><div class="demo-tile t3">3</div><div class="demo-tile empty-cell"></div><div class="demo-tile empty-cell"></div>
        <!-- row 2: partial -->
        <div class="demo-tile t4">4</div><div class="demo-tile empty-cell"></div><div class="demo-tile t7">7</div><div class="demo-tile empty-cell"></div><div class="demo-tile t5">5</div>
        <!-- row 3: full — contains 6 (highlighted pos 0) and 3 (highlighted pos 4) -->
        <div class="demo-tile t6" style="outline:2.5px solid #7c3aed;outline-offset:2px;font-weight:900;">6</div>
        <div class="demo-tile t1">1</div>
        <div class="demo-tile t5">5</div>
        <div class="demo-tile t9">9</div>
        <div class="demo-tile t3" style="outline:2.5px solid #7c3aed;outline-offset:2px;font-weight:900;">3</div>
        <!-- row 4: full — contains 2 (highlighted pos 1) -->
        <div class="demo-tile t8">8</div>
        <div class="demo-tile t2" style="outline:2.5px solid #7c3aed;outline-offset:2px;font-weight:900;">2</div>
        <div class="demo-tile t4">4</div>
        <div class="demo-tile t7">7</div>
        <div class="demo-tile t6">6</div>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;color:#7c3aed;margin-top:4px;"><span style="outline:1.5px solid #7c3aed;border-radius:3px;padding:1px 3px;">6</span> ÷ <span style="outline:1.5px solid #7c3aed;border-radius:3px;padding:1px 3px;">2</span> = <span style="outline:1.5px solid #7c3aed;border-radius:3px;padding:1px 3px;">3</span> — tap anywhere ✓</div>
      <div style="font-family:'Inter',sans-serif;font-size:11px;color:var(--ink-soft);margin-top:3px;">tiles don't need to be adjacent</div>`;
  }
}

function showRules(game){
  const g = GAMES[game];
  if(!g) return;
  if(localStorage.getItem(getSkipKey(game)) === 'true'){
    window.location.href = g.url + '?' + gameUrlSuffix(game);
    return;
  }
  currentGame = game;
  skipChecked = false;
  document.getElementById('rules-title').textContent = `How to play — ${g.name}`;
  renderVisual(game);
  const stepsEl = document.getElementById('rules-steps');
  stepsEl.innerHTML = g.steps.map((s,i) => `
    <div class="rules-step">
      <div class="rules-num" style="background:${g.color}">${i+1}</div>
      <div class="rules-text">${s}</div>
    </div>
  `).join('');
  const btn = document.getElementById('rules-play-btn');
  btn.style.background = g.color;
  btn.style.boxShadow = `0 4px 14px ${g.color}55`;
  document.getElementById('rules-skip-check').className = 'rules-skip-check';
  document.getElementById('rules-overlay').classList.remove('hide');
}

function closeRules(){
  document.getElementById('rules-overlay').classList.add('hide');
  currentGame = null;
}

function closeRulesIfOutside(e){
  if(e.target === document.getElementById('rules-overlay')) closeRules();
}

function toggleSkip(){
  skipChecked = !skipChecked;
  document.getElementById('rules-skip-check').className = `rules-skip-check${skipChecked?' checked':''}`;
}

function goToGame(){
  if(!currentGame) return;
  if(skipChecked) localStorage.setItem(getSkipKey(currentGame), 'true');
  window.location.href = GAMES[currentGame].url + '?' + gameUrlSuffix(currentGame);
}
</script>

</html>
